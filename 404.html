<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page introuvable — Thurnherr Art Marquetry</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Alata&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0a0a0a;
      color: #f0e9dc;
      font-family: Alata, 'Helvetica Neue', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .ornament {
      color: #c9a96e;
      font-size: 0.7rem;
      letter-spacing: 0.3rem;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }
    h1 {
      font-family: Cinzel, Georgia, serif;
      font-size: clamp(2.5rem, 6vw, 4rem);
      font-weight: 400;
      color: #c9a96e;
      margin-bottom: 0.5rem;
    }
    .divider {
      width: 4rem;
      height: 1px;
      background: linear-gradient(90deg, transparent, #c9a96e, transparent);
      margin: 1.5rem auto;
    }
    p {
      color: rgba(240,233,220,0.65);
      font-size: 1rem;
      line-height: 1.8;
      max-width: 36rem;
      margin-bottom: 2.5rem;
    }
    a {
      display: inline-block;
      color: #c9a96e;
      font-size: 0.72rem;
      letter-spacing: 0.2rem;
      text-transform: uppercase;
      text-decoration: none;
      border: 1px solid rgba(201,169,110,0.4);
      padding: 0.8rem 2rem;
      transition: background 0.3s, border-color 0.3s;
    }
    a:hover {
      background: rgba(201,169,110,0.1);
      border-color: #c9a96e;
    }
  </style>
</head>
<body>
  <p class="ornament">Thurnherr Art Marquetry</p>
  <h1>404</h1>
  <div class="divider"></div>
  <p>Cette page est introuvable. Elle a peut-être été déplacée ou n'existe plus.</p>
  <a href="/">Retour à l'accueil</a>
</body>
</html>
